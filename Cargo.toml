[package]
name = "wav-file-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.web-sys]
version = "0.3.4"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'console',
]