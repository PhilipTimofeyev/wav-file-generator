<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sine Gen</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .input-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Sine Wav File Generator</h1>
    <div class="input-container"> 
        <div class="input-div">
            <label>Length (Seconds)</label>
            <input id='length'> </input>
        </div>
        <div class="input-div">
            <label>Frequency (Hz)</label>
            <input id="frequency"></input>
        </div>
        <button id="generate"> Generate</button>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
