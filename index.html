<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WAV Gen</title>
    <style>
      body {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* font-size: 24px; */
      }
      .input-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .input-div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Sine Wav File Generator</h1>
    <div class="input-container"> 
        <div class="input-div">
            <label>Length (Seconds)</label>
            <input id='length'> </input>

        </div>
        <div class="input-div">
            <label>Frequency (Hz)</label>
            <input id="frequency"></input>
        </div>
        <button id="download"> Generate</button>
    </div>

    <script type="module">
        import init, { make_sin, create_wav } from "./pkg/wav_file_generator.js";
        await init();
        
        const downloadBtn = document.getElementById('download')
        
        downloadBtn.addEventListener('click', function() {
            downloadUint8Array()
        })
        
        function downloadUint8Array() {
            const length = parseInt(document.getElementById('length').value)
            const frequency = document.getElementById('frequency').value
            if (!validateLength(length)) return
            if (!validateFrequency(frequency)) return
            const u8Array = new Uint8Array(create_wav(BigInt(length), parseFloat(frequency)))
            const blob = new Blob([u8Array], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'sin.wav';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }     
        
        function validateLength(length) {
            if (!length || length <= 0 || length > 300) {
                alert("Please enter a length between 1 and 300 seconds") 
            } else return true
        }

        function validateFrequency(frequency) {
            if (!frequency ||  frequency <= 0 || frequency >= 24000){
                alert("Please enter a frequency between 1 and 24,000 Hz")
                return false
            } else return true
        }        
    </script>
  </body>
</html>
